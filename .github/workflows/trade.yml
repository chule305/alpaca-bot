name: Trading bot check cycle
# (re-touched to force GitHub to re-index this workflow file)

# Runs the bot's single-cycle mode (trading_bot.py --once) on a schedule
# instead of one continuous local process, since nothing is available to
# leave running locally or on paid/home infrastructure. Each run is a
# fresh, isolated checkout -- state that needs to survive between runs
# (the scanner's watchlist, the daily loss circuit breaker's state) is
# committed back to the repo at the end of every run, so the NEXT run
# picks up exactly where this one left off. See CLAUDE.md / Findings.md
# in the TradingJournal vault for why this exists.

on:
  schedule:
    # Every 20 minutes, weekdays, 12:40-21:00 UTC.
    #
    # IMPORTANT: the cron does NOT set how often the bot checks the market
    # -- trading_bot.py's own --duration-minutes loop does that (every
    # CHECK_INTERVAL_MINUTES, from inside a single long-running job). This
    # schedule only decides how often a new *window* is started.
    #
    # Why: this used to be "*/5" on the assumption that meant a check every
    # 5 minutes. It didn't. On 2026-07-24 GitHub actually fired 5 of the
    # ~96 scheduled ticks (gaps of 65-111 min), and the first one landed at
    # 14:58 UTC -- 88 minutes after the 13:30 open, so the opening-range and
    # gap strategies never got a chance to run at all. GitHub explicitly
    # treats scheduled workflows as best-effort and drops them under load,
    # and hammering it with a high-frequency cron makes that worse, not
    # better. So: fewer, longer-lived jobs that each cover a window, and the
    # schedule only needs to land occasionally for coverage to stay
    # continuous. Starts before the open (12:40 UTC) so a job is already
    # alive and waiting when the bell rings, in both EDT and EST.
    - cron: "*/20 12-21 * * 1-5"
  # Lets you trigger a run manually from the Actions tab, e.g. to verify
  # the setup works before waiting for the next scheduled tick.
  workflow_dispatch:

# Prevents two runs overlapping (e.g. if one run is unusually slow) --
# overlapping runs could both try to commit state changes and race each
# other. Runs queue instead of running concurrently.
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated state files back

jobs:
  trade:
    runs-on: ubuntu-latest
    # Each job now covers a ~2.5h window of trading rather than one instant
    # (see the schedule comment). Timeout is a little above the window so a
    # hung cycle still gets killed rather than blocking the next job.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one check cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # --- Mirrors the tuned settings from .env -- see CLAUDE.md for
          # why each of these has the value it does. Kept explicit here
          # (not left to code defaults) so a future code change to a
          # default can't silently change what the live bot does. ---
          SYMBOLS: "TSLA,NVDA,COIN,AMD,PLTR"
          USE_RISK_BASED_SIZING: "false"
          RISK_PER_TRADE_PCT: "1.0"
          MAX_POSITION_PCT_OF_EQUITY: "25"
          TRADE_AMOUNT_USD: "500"
          MAX_CONCURRENT_POSITIONS: "5"
          MAX_PORTFOLIO_RISK_PCT: "5.0"
          MAX_DAILY_LOSS_PCT: "3"
          CHECK_INTERVAL_MINUTES: "5"
          BAR_MINUTES: "5"
          USE_SCANNER: "true"
          SCANNER_WATCHLIST_SIZE: "12"
          SCANNER_MIN_WATCHLIST_SIZE: "5"
          SCANNER_MIN_PRICE: "10"
          SCANNER_MIN_DOLLAR_VOLUME: "10000000"
          SYMBOL_COOLDOWN_MINUTES: "60"
          MIN_STOP_TO_ATR_RATIO: "2.0"
          VWAP_REVERSION_MAX_ADX: "50"
          SCANNER_REFRESH_HOURS: "0.5"
          SCANNER_MAX_EXTENSION_PCT: "50"
          USE_NEWS_FILTER: "true"
          NEWS_LOOKBACK_HOURS: "24"
          MIN_NEWS_ITEMS: "1"
          EXCLUDE_LEVERAGED_ETFS: "true"
          FAST_MA: "9"
          SLOW_MA: "21"
          RSI_PERIOD: "14"
          RSI_OVERSOLD: "25"
          RSI_OVERBOUGHT: "75"
          BREAKOUT_LOOKBACK: "20"
          BREAKOUT_VOLUME_MULTIPLIER: "2.0"
          USE_BREAKOUT: "true"
          USE_GAP_PATTERN: "true"
          USE_SMASH_DAY_PATTERN: "false"
          USE_ROSS_HOOK: "false"
          USE_ORB: "false"
          USE_RVOL_SPIKE: "false"
          USE_VWAP_REVERSION: "true"
          ADX_PERIOD: "14"
          ADX_TREND_THRESHOLD: "25"
          STOP_LOSS_PCT: "5"
          TAKE_PROFIT_PCT: "10"
          USE_ATR_STOPS: "false"
          FLATTEN_BEFORE_CLOSE: "true"
          FLATTEN_MINUTES_BEFORE_CLOSE: "10"
          STOP_NEW_ENTRIES_MINUTES_BEFORE_CLOSE: "90"
          ENTRY_BLACKOUT_START_MINUTES: "210"
          ENTRY_BLACKOUT_END_MINUTES: "270"
          LOCAL_TIMEZONE: "Europe/Zagreb"
        # 150 min per job, against a 20-min schedule: overlapping windows
        # are intentional. GitHub allows one running + one queued run per
        # concurrency group, so the queued one starts the moment this
        # finishes -- coverage stays continuous even when most cron ticks
        # get dropped. Exits early on its own once the session is over.
        run: python trading_bot.py --duration-minutes 150

      - name: Commit updated state, logs and trade history
        # always() so a run that errored partway still saves the state it
        # did manage to write, rather than throwing the whole day away.
        # This matters most for logs: a run that CRASHED is exactly the
        # one whose log you need, and the runner is destroyed either way.
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watchlist_state.json daily_risk_state.json
          git add -A logs trades.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update bot state [skip ci]"
          # Retry rather than fail: a 150-minute job leaves a wide window
          # for another job's commit to land first. Conflicts on the
          # append-only log/CSV files are resolved by the union merge
          # driver (see .gitattributes) instead of aborting -- on
          # 2026-07-27 this step failed twice and took 150 minutes of
          # trading log down with it.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest and retrying."
            git pull --rebase --autostash || {
              echo "Rebase could not be completed automatically; aborting it and retrying."
              git rebase --abort || true
              git pull --no-rebase --no-edit || true
            }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push bot state after 5 attempts."
          exit 1
